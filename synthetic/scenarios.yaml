# =============================================================================
# SKENARIO KLAIM SINTETIS - TAHAP 0
# =============================================================================
# DATA REKAAN UNTUK DEMONSTRASI. Nama pasien, dokter, dan rumah sakit fiktif.
#
# Setiap skenario menjelaskan "kebenaran klinis" klaim. generate_cases.py
# membangun dokumen (resume, lab harian, CPPT, tagihan) yang konsisten dengan
# kebenaran ini, lalu menghitung ground truth dari dokumen tersebut.
#
# kategori:
#   wajar                 klaim sesuai pedoman, harapan GREEN
#   bermasalah            satu atau lebih aturan klinis seharusnya terpicu
#   dokumen_tidak_lengkap dokumen wajib tidak dilampirkan (harapan PEND)
#   duplikat              klaim tumpang tindih dengan klaim lain di riwayat
#
# Kunci "klinis" hanya untuk field ber-sumber "ai" di kamus data (dibaca AI
# dari narasi). Kunci "lab", "terapi", "tagihan" adalah knob untuk membangun
# dokumen; nilai field dokumen/hitung di ground truth dihitung dari dokumen.
# =============================================================================

