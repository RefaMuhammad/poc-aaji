apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mab.fullname" . }}-config
  labels: {{- include "mab.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- if .Values.ingress.host }}
  CORS_ORIGINS: {{ printf "https://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- if .Values.syntheticData.enabled }}
  LLM_MOCK_FIXTURES_DIR: /app/data/synthetic_output
  {{- end }}
---
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mab.fullname" . }}-secrets
  labels: {{- include "mab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mab.serviceAccountName" . }}
  labels: {{- include "mab.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
