{{- if .Values.backup.enabled }}
# Backup harian database + dokumen ke bucket backup (lihat infra/ops/mab_backup.py dan docs/runbook-operasi.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mab.fullname" . }}-backup
  labels: {{- include "mab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "mab.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- include "mab.podSecurity" . | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "mab.image" (dict "root" . "name" "ops") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["backup"]
              envFrom: {{- include "mab.envFrom" . | nindent 16 }}
              securityContext: {{- include "mab.containerSecurity" . | nindent 16 }}
              resources: {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 20Gi}
{{- end }}
