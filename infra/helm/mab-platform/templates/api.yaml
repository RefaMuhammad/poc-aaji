{{- $c := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mab.fullname" . }}-api
  labels: {{- include "mab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "mab.selector" $c | nindent 6 }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {{- include "mab.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mab.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "mab.podSecurity" . | nindent 8 }}
      initContainers:
        # Migrasi skema dengan kunci advisory: aman walau beberapa pod start bersamaan.
        - name: migrate
          image: {{ include "mab.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "mab_api.migrate"]
          envFrom: {{- include "mab.envFrom" . | nindent 12 }}
          securityContext: {{- include "mab.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: api
          image: {{ include "mab.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          envFrom: {{- include "mab.envFrom" . | nindent 12 }}
          securityContext: {{- include "mab.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "mab.syntheticMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        {{- include "mab.syntheticVolume" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "mab.selector" $c | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mab.fullname" . }}-api
  labels: {{- include "mab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "mab.selector" $c | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
