{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mab.fullname" . }}
  labels: {{- include "mab.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.allowlistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.allowlistSourceRange | quote }}
    {{- end }}
    # HSTS dan header keamanan lain dikirim aplikasi; ingress memaksa HTTPS.
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      hosts:
        - {{ .Values.ingress.host | quote }}
        {{- with .Values.ingress.apiHost }}
        - {{ . | quote }}
        {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mab.fullname" . }}-web
                port: {name: http}
    {{- with .Values.ingress.apiHost }}
    # API integrasi untuk sistem asuransi/TPA (API key: REST, FHIR). Rute portal dan /metrics tidak dibuka di sini.
    - host: {{ . | quote }}
      http:
        paths:
          - path: /integrations/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "mab.fullname" $ }}-api
                port: {name: http}
    {{- end }}
{{- end }}
