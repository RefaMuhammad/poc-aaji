name: mab-poc

x-backend-env: &backend-env
  env_file: .env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Image minio/minio resmi sudah tidak tersedia di Docker Hub, dan tag di quay.io
    # butuh login. Pakai build Bitnami (legacy) yang masih bisa ditarik bebas.
    # Image ini hanya menjalankan API S3 (port 9000), tanpa web console.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend-env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: sh -c "alembic upgrade head && uvicorn mab_api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api/mab_api:/app/mab_api
      - ./apps/api/alembic:/app/alembic
      - ./pipeline/mab_pipeline:/app/mab_pipeline
      - ./rules:/app/rules
      - ./synthetic:/app/synthetic
      - ./infra/scripts:/app/infra/scripts
      - ./tests:/app/tests
      - ./evaluation:/app/evaluation
      - ./data:/app/data
    environment:
      LLM_MOCK_FIXTURES_DIR: /app/data/synthetic_output
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    <<: *backend-env
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: python -m mab_pipeline.worker
    environment:
      LLM_MOCK_FIXTURES_DIR: /app/data/synthetic_output
    volumes:
      - ./apps/api/mab_api:/app/mab_api
      - ./pipeline/mab_pipeline:/app/mab_pipeline
      - ./rules:/app/rules
      - ./evaluation:/app/evaluation
      - ./data:/app/data
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # U2: server SFTP untuk klaim batch dari sistem asuransi/TPA (data rekaan).
  # Login: demo / demo12345 dan pelita / demo12345, port 2222. Folder kerja: /data/{masuk,keluar,...}
  sftp:
    image: atmoz/sftp:alpine
    command: demo:demo12345:1001:1001 pelita:demo12345:1002:1002
    volumes:
      - ./data/sftp/DEMO:/home/demo/data
      - ./data/sftp/PELITA:/home/pelita/data
    ports:
      - "2222:22"

  # U2: memproses ZIP di data/sftp/<KODE>/masuk dan menulis hasil ke keluar/
  sftp-watcher:
    <<: *backend-env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: python -m mab_pipeline.sftp_watcher
    environment:
      SFTP_ROOT: /app/data/sftp
    volumes:
      - ./apps/api/mab_api:/app/mab_api
      - ./pipeline/mab_pipeline:/app/mab_pipeline
      - ./rules:/app/rules
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_started}

  # U6: laporan bulanan otomatis (bulan lalu, per tenant + seluruh platform), cek tiap jam
  report-scheduler:
    <<: *backend-env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: python -m mab_api.report_scheduler
    volumes:
      - ./apps/api/mab_api:/app/mab_api
      - ./pipeline/mab_pipeline:/app/mab_pipeline
      - ./rules:/app/rules
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_started}

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Browser memanggil /api/* di web; web meneruskannya ke API di jaringan compose.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Alat pembuat data sintetis. Tidak ikut "docker compose up";
  # jalankan dengan: docker compose run --rm synthetic
  synthetic:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/synthetic.Dockerfile
    volumes:
      - ./synthetic:/app/synthetic
      - ./pipeline/mab_pipeline:/app/mab_pipeline
      - ./rules:/app/rules
      - ./data:/app/data

volumes:
  pgdata:
  miniodata:
